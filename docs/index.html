<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U10 Mixed Orange Ladder – Hills Raiders 2026/27</title>
<style>
  :root { --orange: #f47c20; --dark: #1a1a2e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  header { background: var(--dark); color: white; width: 100%; padding: 24px 16px; text-align: center; }
  header h1 { font-size: 1.2rem; font-weight: 700; }
  header p { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }
  .card { background: white; border-radius: 16px; padding: 40px 32px; margin: 32px 16px; text-align: center; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .ball { font-size: 3rem; margin-bottom: 16px; }
  h2 { font-size: 1.1rem; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
  p { color: #6b7280; font-size: 0.9rem; line-height: 1.5; }
  .badge { display: inline-block; background: var(--orange); color: white; font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>U10 Mixed Orange — Hills Raiders 2026/27</h1>
  <p>Saturday Domestic Competition · Darlington Basketball Club</p>
</header>
<div class="card">
  <div class="ball">🏀</div>
  <h2>Season kicking off soon!</h2>
  <p>The ladder will appear here automatically after the first games are played. Check back Saturday afternoon.</p>
  <span class="badge">Auto-updates every Saturday at 3:30pm</span>
</div>
</body>
</html>
